services:
  postgres:
    image: postgres:17-alpine
    container_name: ktor-postgres
    environment:
      POSTGRES_USER: ktor
      POSTGRES_PASSWORD: ktorpassword
      POSTGRES_DB: ktordb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktor -d ktordb"]
      interval: 5s
      timeout: 5s
      retries: 5
