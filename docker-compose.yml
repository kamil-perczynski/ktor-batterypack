services:
  postgres:
    image: postgres:17-alpine
    container_name: ktor-postgres
    environment:
      POSTGRES_USER: ktor
      POSTGRES_PASSWORD: ktorpassword
      POSTGRES_DB: ktordb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktor -d ktordb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: oh
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight_ui
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped

  ktor-frame:
    image: ktor-frame:latest
    deploy:
      resources:
        limits:
          memory: 256M
    container_name: ktor-frame
    ports:
      - "18080:8080"
    environment:
      APP_PROFILES: docker
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
