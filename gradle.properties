#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8g
#Gradle
# --enable-native-access=ALL-UNNAMED is required because Java 24+ (JEP 472) restricts System::load/loadLibrary.
# Gradle's native-platform and Netty load native libraries from unnamed modules, which triggers warnings
# (and will eventually be blocked) without this flag.
# Can be removed once both Gradle and Netty fully adapt to JEP 472 (likely years away).
org.gradle.jvmargs=-Xmx12g -Dfile.encoding=UTF-8 --add-opens java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
org.gradle.configuration-cache=true
org.gradle.caching=true
