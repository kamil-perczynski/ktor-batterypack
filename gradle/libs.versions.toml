[versions]
assertj = "3.27.7"
handlebars = "4.5.3"
dotenv-kotlin = "6.5.1"
exposed = "1.5.0"
guava = "33.6.0-jre"
hikari = "7.0.2"
lettuce = "7.5.1.RELEASE"
jackson = "3.1.3"
ktor = "3.4.0"
ktor-batterypack = "0.0.0-SNAPSHOT"
hoplite = "2.9.0"
junit = "5.14.4"
koin = "4.2.1"
koin-plugin = "1.0.0-RC2"
kotlin = "2.3.20"
ksp = "2.3.10"
logback = "1.5.21"
logstash-logback-encoder = "9.0"
micrometer = "1.14.0"
mockito = "5.2.1"
testcontainers = "2.0.5"
wiremock = "3.13.2"
kotlinx-coroutines = "1.10.2"
jakarta-validation = "3.1.1"
jakarta-ws-rs = "4.0.0"
jakarta-annotation = "3.0.0"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }
handlebars = { module = "com.github.jknack:handlebars", version.ref = "handlebars" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
hoplite-core = { module = "com.sksamuel.hoplite:hoplite-core", version.ref = "hoplite" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
hoplite-yaml = { module = "com.sksamuel.hoplite:hoplite-yaml", version.ref = "hoplite" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.10" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
jakarta-ws-rs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakarta-ws-rs" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
dotenv-kotlin = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv-kotlin" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }

ktor-batterypack-annotations = { module = "io.github.ktor_batterypack:ktor-batterypack-annotations", version.ref = "ktor-batterypack" }
ktor-batterypack-core = { module = "io.github.ktor_batterypack:ktor-batterypack-core", version.ref = "ktor-batterypack" }
ktor-batterypack-database = { module = "io.github.ktor_batterypack:ktor-batterypack-database", version.ref = "ktor-batterypack" }
ktor-batterypack-database-testing = { module = "io.github.ktor_batterypack:ktor-batterypack-database-testing", version.ref = "ktor-batterypack" }
ktor-batterypack-metrics = { module = "io.github.ktor_batterypack:ktor-batterypack-metrics", version.ref = "ktor-batterypack" }
ktor-batterypack-redis = { module = "io.github.ktor_batterypack:ktor-batterypack-redis", version.ref = "ktor-batterypack" }
ktor-batterypack-redis-testing = { module = "io.github.ktor_batterypack:ktor-batterypack-redis-testing", version.ref = "ktor-batterypack" }
ktor-batterypack-validation = { module = "io.github.ktor_batterypack:ktor-batterypack-validation", version.ref = "ktor-batterypack" }
ktor-batterypack-validation-ksp = { module = "io.github.ktor_batterypack:ktor-batterypack-validation-ksp", version.ref = "ktor-batterypack" }

ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor-batterypack = { id = "ktor-batterypack-gradle-plugin", version.ref = "ktor-batterypack" }
