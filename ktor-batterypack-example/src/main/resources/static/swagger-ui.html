<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="webjars/swagger-ui/5.32.15/swagger-ui.css"/>
    <link rel="stylesheet" type="text/css" href="webjars/swagger-ui/5.32.15/index.css"/>
    <link rel="icon" type="image/png" href="webjars/swagger-ui/5.32.15/favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="webjars/swagger-ui/5.32.15/favicon-16x16.png" sizes="16x16"/>
</head>

<body>
<div id="swagger-ui"></div>
    <script src="webjars/swagger-ui/5.32.15/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="webjars/swagger-ui/5.32.15/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script src="webjars/swagger-ui/5.32.15/swagger-initializer.js" charset="UTF-8"></script>
<script>
    window.onload = function () {

        // Build a system
        const ui = SwaggerUIBundle({
            urls: [
                {
                    url: "schema/api.yaml",
                    name: "Kroplowa API"
                }
            ],
            validatorUrl: null,
            defaultModelsExpandDepth: 0,
            docExpansion: "list",
            filter: false,
            displayRequestDuration: true,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout"
        });

        window.ui = ui
    }
</script>
</body>
</html>
