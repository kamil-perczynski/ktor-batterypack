$schema: https://json-schema.org/draft/2020-12/schema
$id: constraints-descriptor.schema.yaml
title: Constraints Descriptor Configuration
type: object
additionalProperties: false
required:
  - defaults
  - constraints
properties:
  $schema:
    type: string
  defaults:
    type: object
    additionalProperties: false
    required:
      - className
    properties:
      className:
        type: string
        description: Fully qualified name of the class or object with the constraint methods.
  constraints:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - annotation
      properties:
        annotation:
          type: string
          description: Fully qualified constraint annotation name.
        className:
          type: string
          description: Fully qualified name of the class or object with the constraint method. Overrides defaults.className.
        methodName:
          type: string
          description: Name of the constraint method. Defaults to check followed by the annotation simple name.
        json:
          type: object
          additionalProperties: false
          description: Overrides the constraint method used by @JsonValidator implementations.
          properties:
            className:
              type: string
              description: Fully qualified name of the class or object with the JSON constraint method.
            methodName:
              type: string
              description: Name of the JSON constraint method.
        rejectsNull:
          type: boolean
          description: When true, a null or missing value violates the constraint and is reported as NotNull.
        supportedTypes:
          type: array
          description: >-
            Fully qualified Kotlin types the constraint may annotate. kotlin.collections.Collection matches any
            collection or array, kotlin.collections.Map matches any map. When omitted, the type is not checked.
          items:
            type: string
