$schema: https://json-schema.org/draft/2020-12/schema
$id: constraints-descriptor.schema.yaml
title: Constraints Descriptor Configuration
type: object
additionalProperties: false
required:
  - imports
  - jsonImports
  - defaults
  - constraints
properties:
  imports:
    type: array
    items:
      type: string
      description: Fully qualified import for the constraints helper.
  jsonImports:
    type: array
    items:
      type: string
      description: Fully qualified import for the JSON constraints helper.
  defaults:
    type: object
    additionalProperties: false
    required:
      - simpleClassName
    properties:
      simpleClassName:
        type: string
        description: Simple class name with the constraint methods
      callTpl:
        type: string
        description: Default call template applied to every constraint.
      jsonCallTpl:
        type: string
        description: Default JSON call template applied to every constraint.
  constraints:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - annotation
      properties:
        annotation:
          type: string
          description: Fully qualified constraint annotation name.
        callTpl:
          type: string
          description: Overrides the default call template.
        jsonCallTpl:
          type: string
          description: Overrides the default JSON call template.
        simpleClassName:
          type: string
          description: Simple class name with the constraint methods
