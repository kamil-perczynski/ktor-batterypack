$schema: ../constraints-descriptor.schema.yaml
defaults:
  className: io.github.ktor_batterypack.validation.Constraints
constraints:
  - annotation: jakarta.validation.constraints.NotNull
    rejectsNull: true
  - annotation: jakarta.validation.constraints.Null
  - annotation: jakarta.validation.constraints.NotBlank
    rejectsNull: true
    supportedTypes:
      - kotlin.String
  - annotation: jakarta.validation.constraints.NotEmpty
    rejectsNull: true
    json:
      className: io.github.ktor_batterypack.validation.JsonConstraints
    supportedTypes:
      - kotlin.String
      - kotlin.collections.Collection
      - kotlin.collections.Map
  - annotation: jakarta.validation.constraints.Min
    supportedTypes:
      - kotlin.Byte
      - kotlin.Short
      - kotlin.Int
      - kotlin.Long
      - kotlin.Float
      - kotlin.Double
      - java.math.BigInteger
      - java.math.BigDecimal
  - annotation: jakarta.validation.constraints.Max
    supportedTypes:
      - kotlin.Byte
      - kotlin.Short
      - kotlin.Int
      - kotlin.Long
      - kotlin.Float
      - kotlin.Double
      - java.math.BigInteger
      - java.math.BigDecimal
  - annotation: jakarta.validation.constraints.Size
    json:
      className: io.github.ktor_batterypack.validation.JsonConstraints
    supportedTypes:
      - kotlin.String
      - kotlin.collections.Collection
      - kotlin.collections.Map
  - annotation: jakarta.validation.constraints.Past
    supportedTypes:
      - java.util.Date
      - java.util.Calendar
      - java.time.Instant
      - java.time.LocalDate
      - java.time.LocalDateTime
      - java.time.LocalTime
      - java.time.MonthDay
      - java.time.OffsetDateTime
      - java.time.OffsetTime
      - java.time.Year
      - java.time.YearMonth
      - java.time.ZonedDateTime
      - java.time.chrono.HijrahDate
      - java.time.chrono.JapaneseDate
      - java.time.chrono.MinguoDate
      - java.time.chrono.ThaiBuddhistDate
  - annotation: jakarta.validation.constraints.PastOrPresent
    supportedTypes:
      - java.util.Date
      - java.util.Calendar
      - java.time.Instant
      - java.time.LocalDate
      - java.time.LocalDateTime
      - java.time.LocalTime
      - java.time.MonthDay
      - java.time.OffsetDateTime
      - java.time.OffsetTime
      - java.time.Year
      - java.time.YearMonth
      - java.time.ZonedDateTime
      - java.time.chrono.HijrahDate
      - java.time.chrono.JapaneseDate
      - java.time.chrono.MinguoDate
      - java.time.chrono.ThaiBuddhistDate
