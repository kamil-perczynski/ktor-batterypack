      - kotlin.Byte
      - kotlin.Short
      - kotlin.Int
      - kotlin.Long
      - kotlin.Float
      - kotlin.Double
      - java.math.BigInteger
      - java.math.BigDecimal
      - kotlin.String
  - annotation: jakarta.validation.constraints.DecimalMin
    supportedTypes:
      - kotlin.Byte
      - kotlin.Short
      - kotlin.Int
      - kotlin.Long
      - kotlin.Float
      - kotlin.Double
      - java.math.BigInteger
      - java.math.BigDecimal
      - kotlin.String
  - annotation: jakarta.validation.constraints.Digits
    supportedTypes:
      - kotlin.Byte
      - kotlin.Short
      - kotlin.Int
      - kotlin.Long
      - kotlin.Float
      - kotlin.Double
      - java.math.BigInteger
      - java.math.BigDecimal
      - kotlin.String
