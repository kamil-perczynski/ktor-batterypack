$schema: https://json-schema.org/draft/2020-12/schema
$id: jakarta-constraints.schema.yaml
title: Jakarta Constraints Configuration
type: object
additionalProperties: false
required:
  - import
  - jsonImport
  - defaults
  - constraints
properties:
  import:
    type: string
    description: Fully qualified import for the constraints helper.
  jsonImport:
    type: string
    description: Fully qualified import for the JSON constraints helper.
  defaults:
    type: object
    additionalProperties: false
    required:
      - callTpl
      - jsonCallTpl
    properties:
      callTpl:
        type: string
        description: Default call template applied to every constraint.
      jsonCallTpl:
        type: string
        description: Default JSON call template applied to every constraint.
  constraints:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - annotation
      properties:
        annotation:
          type: string
          description: Fully qualified constraint annotation name.
        callTpl:
          type: string
          description: Overrides the default call template.
        jsonCallTpl:
          type: string
          description: Overrides the default JSON call template.
